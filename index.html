<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>느금마 디펜스 - 엄마를 지켜라!</title>
<style>
:root{color-scheme:dark;--bg:#101522;--panel:#1a2335;--line:#34435d;--gold:#ffd166;--cyan:#70d6ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f4f6fb;font-family:system-ui,sans-serif}
main{max-width:1180px;margin:auto;padding:18px}.top{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
h1{font-size:clamp(22px,4vw,34px);margin:4px 0}.sub{color:#b9c5d8;margin:0 0 16px}
.stats,.controls,.unitpanel,.log{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}
.stats{display:flex;gap:18px;flex-wrap:wrap}.stat b{color:var(--gold);font-size:20px}
button{border:1px solid #536783;background:#293750;color:white;padding:10px 14px;border-radius:10px;font-weight:700;cursor:pointer}
button:hover{filter:brightness(1.2)}button:disabled{opacity:.4;cursor:not-allowed}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:12px}
.arena{background:#151d2b;border:1px solid var(--line);border-radius:14px;padding:12px;overflow:hidden}
.lanes{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.lane{min-height:142px;background:#202c40;border:1px solid #41516a;border-radius:10px;padding:8px;position:relative;display:flex;flex-direction:column;gap:5px}
.lane:nth-child(5n+1){background:#26344a}.lane:nth-child(5n+2){background:#24374a}.lane:nth-child(5n+3){background:#2b3448}.lane:nth-child(5n+4){background:#2b3a48}.lane:nth-child(5n){background:#30364a}
.lanehead{font-size:11px;color:#b6c5d8;display:flex;justify-content:space-between}
.slot{flex:1;border:1px dashed #6a7890;border-radius:8px;display:flex;align-items:center;justify-content:center;text-align:center;min-height:92px;cursor:pointer;padding:5px}
.slot.empty{color:#aab7ca}.slot.unit{border-style:solid;border-color:#91a8c9;background:#182235;display:block;text-align:left}
.slot.selected{outline:2px solid var(--gold);border-color:var(--gold)}
.unitname{font-weight:800;font-size:13px}.unitmeta{font-size:11px;color:#c1cee0;margin-top:4px}
.hpbar{height:6px;background:#4b2633;border-radius:5px;margin:6px 0;overflow:hidden}.hpbar i{display:block;height:100%;background:#68d391}
.enemy{font-size:11px;color:#ff9b9b}.aside{display:flex;flex-direction:column;gap:12px}.unitpanel h2{font-size:17px;margin:0 0 8px}.unitpanel p{font-size:13px;color:#c7d2e2;line-height:1.5}.log{height:210px;overflow:auto;font-size:12px;color:#c7d2e2}.log div{padding:3px 0;border-bottom:1px solid #2b3850}
.note{font-size:12px;color:#aab7ca;margin:10px 2px}
@media(max-width:850px){.layout{grid-template-columns:1fr}.lanes{gap:5px}.lane{min-height:125px;padding:5px}.slot{min-height:80px}.aside{display:grid;grid-template-columns:1fr 1fr}}
@media(max-width:520px){main{padding:9px}.lanes{gap:3px}.lane{min-height:115px;padding:3px}.lanehead{font-size:9px}.unitname{font-size:10px}.unitmeta{font-size:9px}.slot{min-height:75px;padding:3px}.aside{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
 <div class="top"><div><h1>느금마 디펜스</h1><p class="sub">엄마를 지켜라! · 실시간 타워 디펜스</p></div><div class="stats">
  <div class="stat">엄마 HP<br><b id="mom">10 / 10</b></div><div class="stat">코인<br><b id="coins">150</b></div><div class="stat">라운드<br><b id="round">1</b></div><div class="stat">남은 적<br><b id="left">10</b></div>
 </div></div>
 <div class="controls"><button id="summon">랜덤 소환 (10)</button><button id="upgrade" disabled>선택 캐릭터 EXP +100 (200)</button><button id="pause">일시정지</button><button id="reset">다시 시작</button></div>
 <div class="layout"><section class="arena"><div class="lanes" id="board"></div><p class="note">적은 왼쪽에서 오른쪽으로 이동합니다. 캐릭터는 배치된 칸에서 왼쪽을 향해 공격합니다. 빈 칸을 누른 뒤 소환한 캐릭터를 배치하세요. 캐릭터 이동은 각자 한 번만 가능합니다.</p></section>
 <aside class="aside"><section class="unitpanel"><h2 id="detailTitle">캐릭터 정보</h2><div id="detail">캐릭터 칸을 선택하면 정보가 표시됩니다.</div><button id="move" disabled>이동할 빈 칸 선택</button></section><section class="unitpanel"><h2>진행 상황</h2><p id="status">전투 준비 완료</p><p>라운드는 5초마다 자동으로 진행됩니다. 적 처치 시 5코인, 처치 캐릭터는 EXP 10을 얻습니다.</p></section><section class="log" id="log"></section></aside></div>
</main>
<script>
(()=>{
const $=id=>document.getElementById(id), board=$('board');
const defs={
 '제너럴 K':{hp:1000,atk:100,cd:2,color:'#5ca9ff',skills:['영혼 베기','영혼 사슬 (100 EXP)','영혼 늑대 출격 (200 EXP)','절멸자 모드 (300 EXP)']},
 '클라이벳':{hp:250,atk:100,cd:2,color:'#c7a5ff',skills:['정복자의 검','영혼을 담은 힘 (50 EXP)','영혼 불꽃 (100 EXP)']},
 '미사':{hp:300,atk:15,cd:2,color:'#ff9bd2',skills:['냥냥이탄','살인병기 발톱 (100 EXP)','캣닢공 (200 EXP)','냐아아아아아오오오옹! (300 EXP)']}
};
let units=[],enemies=[],shots=[],fx=[],coins=150,round=1,mom=10,spawned=0,killed=0,spawnClock=0,roundClock=0,paused=false,selected=null,moveMode=false,summonCost=10,upgradeCost=200,last=performance.now(),uid=1;
const deck=['제너럴 K','제너럴 K','클라이벳','클라이벳','미사'];
const cell=(r,c)=>r*5+c;
function log(s){let d=document.createElement('div');d.textContent=s;$('log').prepend(d);while($('log').children.length>35)$('log').lastChild.remove()}
function addUnit(name,slot){let d=defs[name];let u={id:uid++,name,slot,hp:d.hp,maxHp:d.hp,exp:0,level:0,lastAtk:0,lastChain:0,lastWolf:0,lastFire:0,usedMove:false};units.push(u);log(name+' 배치 완료');render()}
function render(){
 board.innerHTML='';
 for(let i=0;i<15;i++){let r=Math.floor(i/5)+1,c=i%5+1,u=units.find(x=>x.slot===i),e=enemies.filter(x=>x.lane===i);
 let lane=document.createElement('div');lane.className='lane';lane.innerHTML='<div class="lanehead"><span>'+r+'행 · '+c+'열</span><span>칸 '+(i+1)+'</span></div>';
 let s=document.createElement('div');s.className='slot '+(u?'unit':'empty')+(selected===u?.id?' selected':'');
 if(u){let p=Math.max(0,u.hp/u.maxHp*100);s.innerHTML='<div class="unitname" style="color:'+defs[u.name].color+'">'+u.name+'</div><div class="hpbar"><i style="width:'+p+'%"></i></div><div class="unitmeta">HP '+Math.ceil(u.hp)+'/'+u.maxHp+'<br>EXP '+u.exp+' · Lv.'+u.level+(u.usedMove?' · 이동 완료':'')+'</div>'}
 else s.innerHTML='<div>＋<br>빈 슬롯</div>';
 if(e.length){let x=document.createElement('div');x.className='enemy';x.textContent='적 '+e.length+'기';lane.appendChild(x)}
 s.onclick=()=>{if(moveMode&&selected!==null){let from=units.find(x=>x.id===selected),dest=units.find(x=>x.slot===i);if(from&&!dest&&!from.usedMove){from.slot=i;from.usedMove=true;moveMode=false;log(from.name+' 이동 완료');render();return}}
 if(u){selected=u.id;moveMode=false;showUnit()}else if(selected!==null){let carried=window.pendingUnit;if(carried){addUnit(carried,i);window.pendingUnit=null}else if(moveMode){moveMode=false}}
 render()};
 lane.appendChild(s);board.appendChild(lane)}
 $('coins').textContent=coins;$('mom').textContent=mom+' / 10';$('round').textContent=round;$('left').textContent=Math.max(0,enemyCount(round)-spawned+killed*-1);
 $('summon').textContent='랜덤 소환 ('+summonCost+')';$('upgrade').textContent='선택 캐릭터 EXP +100 ('+upgradeCost+')';
 $('upgrade').disabled=!units.some(x=>x.id===selected)||coins<upgradeCost;
}
function showUnit(){let u=units.find(x=>x.id===selected);if(!u){$('detailTitle').textContent='캐릭터 정보';$('detail').textContent='캐릭터 칸을 선택하면 정보가 표시됩니다.';$('move').disabled=true;return}
 $('detailTitle').textContent=u.name;$('detail').innerHTML='<p>HP: '+Math.ceil(u.hp)+' / '+u.maxHp+'<br>EXP: '+u.exp+'<br>레벨: '+u.level+'<br>공격력: '+Math.round(defs[u.name].atk*Math.pow(1.1,u.level))+'</p><p>'+defs[u.name].skills.filter((s,i)=>i===0||u.exp>=[100,200,300][i-1]||u.name==='클라이벳'&&u.exp>=[50,100][i-1]).join('<br>')+'</p>';
 $('move').disabled=u.usedMove;$('move').textContent=u.usedMove?'이동 완료':'이동할 빈 칸 선택';$('upgrade').disabled=coins<upgradeCost}
function enemyCount(r){return r===1?10:r===2?15:r===3?20:20+r}
function enemyStats(r){let hp=100,atk=10;if(r===2||r===3){hp*=1.05**(r-1);atk*=1.05**(r-1)}else if(r>=4){hp*=1.05**2*1.1**(r-3);atk*=1.05**2*1.1**(r-3)}if(r%50===0){hp*=2;atk*=2}else if(r%25===0){hp*=1.5;atk*=1.5}return{hp,atk}}
function spawn(){let s=enemyStats(round);let lane=Math.floor(Math.random()*3)*5+4;enemies.push({id:uid++,lane,x:-.1,hp:s.hp,maxHp:s.hp,atk:s.atk,speed:.24});spawned++}
function hit(e,d,u){if(!enemies.includes(e))return;e.hp-=d;fx.push({x:e.x,lane:e.lane,t:.3,text:'-'+Math.round(d)});if(e.hp<=0){enemies=enemies.filter(x=>x!==e);coins+=5;killed++;if(u){u.exp+=10;let lv=Math.floor(u.exp/100);if(lv>u.level){u.level=lv;let ratio=u.hp/u.maxHp;u.maxHp*=1.1;u.hp=u.maxHp*ratio;log(u.name+' 레벨 상승!')}}}}
function attack(u,now){let d=defs[u.name],cd=d.cd*(u.name==='제너럴 K'&&u.exp>=300?.5:1);if(now-u.lastAtk<cd)return;let target=enemies.filter(e=>e.lane===u.slot&&e.x<u.slot%5+.5).sort((a,b)=>b.x-a.x)[0];if(!target)return;u.lastAtk=now;let dmg=d.atk*Math.pow(1.1,u.level);hit(target,dmg,u);
 if(u.name==='클라이벳'&&u.exp>=50){for(let e of [...enemies])if(Math.abs(e.lane-u.slot)<=6&&e!==target&&Math.abs(e.x-(u.slot%5))<1.2)hit(e,dmg*.15,u)}
 if(u.name==='클라이벳')u.hp=Math.min(u.maxHp,u.hp+dmg*.25);
 if(u.name==='제너럴 K'&&u.exp>=100&&now-u.lastChain>=8){let candidates=enemies.filter(e=>Math.abs(e.lane-u.slot)===4);if(candidates.length){let t=candidates[Math.floor(Math.random()*candidates.length)];u.lastChain=now;hit(t,50*Math.pow(1.1,u.level),u);t.x=Math.min(t.x,u.slot%5+.2)}}
 if(u.name==='제너럴 K'&&u.exp>=200&&now-u.lastWolf>=15){u.lastWolf=now;shots.push({type:'wolf',lane:u.slot,x:5.1,speed:1,damage:50*Math.pow(1.1,u.level),owner:u.id})}
 if(u.name==='클라이벳'&&u.exp>=100&&now-u.lastFire>=10){u.lastFire=now;fx.push({lane:u.slot,x:0,t:3,text:'영혼 불꽃'});for(let e of [...enemies])if(e.lane===u.slot)hit(e,30,u)}
 if(u.name==='미사'&&u.exp>=100&&now-u.lastChain>=8){u.lastChain=now;let t=enemies.find(e=>e.lane===u.slot&&e.x<u.slot%5+3);if(t)hit(t,100*Math.pow(1.1,u.level),u)}
 if(u.name==='미사'&&u.exp>=200&&now-u.lastWolf>=15){u.lastWolf=now;let ally=units.find(a=>a.id!==u.id&&a.hp<a.maxHp);if(ally)ally.hp=Math.min(ally.maxHp,ally.hp+50)}
 if(u.name==='미사'&&u.exp>=300&&now-u.lastFire>=20){u.lastFire=now;for(let e of [...enemies])hit(e,10*Math.pow(1.1,u.level),u)}
}
function update(dt,now){if(paused)return;roundClock+=dt;spawnClock+=dt;if(roundClock>=5){roundClock-=5;round++;spawned=0;killed=0;log('라운드 '+round+' 시작')}
 if(spawned<enemyCount(round)&&spawnClock>=1){spawnClock-=1;spawn()}
 for(let e of [...enemies]){e.x+=e.speed*dt;if(e.x>=5){mom-=1;enemies=enemies.filter(x=>x!==e);log('적이 엄마에게 도달했다!');if(mom<=0){mom=0;paused=true;$('status').textContent='엄마를 지키지 못했습니다.'}}}
 for(let u of units)attack(u,now);
 for(let s of [...shots]){s.x-=s.speed*dt;let t=enemies.find(e=>e.lane===s.lane&&Math.abs(e.x-s.x)<.22);if(t){hit(t,s.damage,units.find(u=>u.id===s.owner));shots=shots.filter(x=>x!==s)}else if(s.x<-.2)shots=shots.filter(x=>x!==s)}
 for(let u of units){if(u.name==='제너럴 K'&&u.exp>=300)u.hp=Math.min(u.maxHp,u.hp+dt*1)}
 fx=fx.filter(f=>(f.t-=dt)>0);
}
function draw(){/* DOM grid is the battlefield; projectiles and enemies are shown as compact status labels. */}
function loop(t){let dt=Math.min(.05,(t-last)/1000);last=t;update(dt,t/1000);if(Math.floor(t/200)!==Math.floor((t-dt*1000)/200))render();requestAnimationFrame(loop)}
$('summon').onclick=()=>{if(coins<summonCost)return;coins-=summonCost;summonCost+=10;let name=deck[Math.floor(Math.random()*deck.length)];window.pendingUnit=name;let empty=[...board.children].findIndex((el,i)=>!units.some(u=>u.slot===i));if(empty>=0)addUnit(name,empty);else log(name+' 소환! 빈 칸을 선택해 배치하세요.');render()};
$('upgrade').onclick=()=>{let u=units.find(x=>x.id===selected);if(!u||coins<upgradeCost)return;coins-=upgradeCost;u.exp+=100;u.level=Math.floor(u.exp/100);let ratio=u.hp/u.maxHp;u.maxHp*=1.1;u.hp=u.maxHp*ratio;upgradeCost+=100;showUnit();render();log(u.name+' EXP +100')};
$('move').onclick=()=>{let u=units.find(x=>x.id===selected);if(!u||u.usedMove)return;moveMode=true;$('status').textContent='이동할 빈 칸을 선택하세요.'};
$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'계속하기':'일시정지'};
$('reset').onclick=()=>{if(!confirm('게임을 처음부터 다시 시작할까요?'))return;units=[];enemies=[];shots=[];coins=150;round=1;mom=10;spawned=0;killed=0;spawnClock=0;roundClock=0;paused=false;selected=null;summonCost=10;upgradeCost=200;$('status').textContent='전투 준비 완료';$('log').innerHTML='';render();showUnit()};
render();showUnit();requestAnimationFrame(loop);
})();
</script>
</body></html>
